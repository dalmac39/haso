<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a0d">
  <meta name="description" content="DALMAC PS4 Offline Edition — المضيف غير المتصل">
  <title>DALMAC PS4</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/jpeg" href="assets/branding/dalmac-logo.jpg">
  <link rel="apple-touch-icon" href="assets/branding/dalmac-logo.jpg">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>

  <!-- Full-screen Background -->
  <div class="dalmac-bg" aria-hidden="true"></div>

  <!-- Main UI -->
  <main class="dalmac-main">
    <div class="dalmac-card">

      <!-- DALMAC Logo -->
      <img
        src="assets/branding/dalmac-logo.jpg"
        alt="DALMAC Logo"
        class="dalmac-logo"
        width="130"
        height="130"
      >

      <!-- Title Block -->
      <h1 class="dalmac-title" id="dalmac-title">DALMAC PS4</h1>
      <div class="dalmac-subtitle" id="dalmac-subtitle">الإصدار غير المتصل</div>

      <!-- Firmware Status Badge -->
      <div class="fw-badge experimental" id="fw-badge">
        <span class="dot" aria-hidden="true"></span>
        <span id="fw-badge-label">إصدار النظام: 13.52</span>
        <span class="badge-sep">—</span>
        <span id="fw-badge-status">تجريبي</span>
      </div>

      <!-- Alert Banner (hidden by default) -->
      <div class="dalmac-alert" id="dalmac-alert" role="alert" style="display: none;">
        <span class="alert-icon" aria-hidden="true">⚠️</span>
        <span class="alert-text" id="alert-text"></span>
      </div>

      <!-- Action Button -->
      <div class="action-wrap">
        <button class="btn-start" id="btn-start" type="button">بدء التشغيل</button>
      </div>

      <!-- System & Configuration Grid -->
      <div class="status-grid">
        <!-- Detected Firmware -->
        <div class="status-item">
          <span class="status-label" id="lbl-detected-fw">إصدار النظام المكتشف</span>
          <span class="status-value mono" id="val-detected-fw">13.52</span>
        </div>

        <!-- Configuration -->
        <div class="status-item">
          <span class="status-label" id="lbl-config-fw">الإعدادات</span>
          <span class="status-value mono" id="val-config-fw">13.52</span>
        </div>

        <!-- Kernel Patch -->
        <div class="status-item">
          <span class="status-label" id="lbl-patch">ملف الترقيع</span>
          <span class="status-value mono" id="val-patch">1352.bin</span>
        </div>

        <!-- Payload -->
        <div class="status-item">
          <span class="status-label" id="lbl-payload">الحمولة</span>
          <span class="status-value mono" id="val-payload">goldhen.bin</span>
        </div>

        <!-- Application Engine -->
        <div class="status-item">
          <span class="status-label" id="lbl-engine">المحرك</span>
          <span class="status-value ok" id="val-engine">جاهز</span>
        </div>

        <!-- Offline Storage -->
        <div class="status-item">
          <span class="status-label" id="lbl-offline">التخزين غير المتصل</span>
          <span class="status-value ok" id="val-offline">جاهز</span>
        </div>
      </div>

      <!-- Diagnostic Log Toggle -->
      <button class="log-toggle" id="log-toggle" type="button" aria-expanded="false" aria-controls="log-panel">
        <span class="log-text">إظهار السجل</span>
        <span class="arrow" aria-hidden="true">▼</span>
      </button>

      <!-- Diagnostic Log Panel -->
      <div class="log-panel" id="log-panel">
        <div class="log-content" id="log-content" role="log" aria-live="polite"></div>
      </div>

      <!-- Language Toggle Switch -->
      <div class="lang-toggle">
        <button id="lang-ar" class="active" type="button">العربية</button>
        <span class="sep">|</span>
        <button id="lang-en" type="button">English</button>
      </div>

    </div><!-- /.dalmac-card -->
  </main>

  <!-- Cache Status Banner (Footer) -->
  <div class="cache-status" id="cache-status"></div>

  <!-- Application Logic (ES Module) -->
  <script type="module" src="app.js"></script>

</body>
</html>
